name: AURA CI/CD Pipeline & Audit Gate

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Fast GitHub-Hosted Quality Gates (Linux, Windows, macOS Matrix)
  # ---------------------------------------------------------------------------
  quality_and_unit_tests:
    name: Code Quality & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint Code with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit Tests
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # STAGE 2: Security & License Audit
  # ---------------------------------------------------------------------------
  security_and_licenses:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cargo Audit & Cargo Deny
        run: |
          cargo install cargo-deny --locked || true

      - name: Audit Dependency Licenses
        run: cargo deny check licenses || true

  # ---------------------------------------------------------------------------
  # STAGE 3: Multi-Platform Release Builds
  # ---------------------------------------------------------------------------
  build_release_binaries:
    name: Build Release Binaries (${{ matrix.os }})
    needs: [quality_and_unit_tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release --workspace
