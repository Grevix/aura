[workspace]
members = [
    "crates/aura-core",
    "crates/aura-hardware",
    "crates/aura-model",
    "crates/aura-planner",
    "crates/aura-memory",
    "crates/aura-backends",
    "crates/aura-benchmark",
    "crates/aura-audit",
    "crates/aura-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AURA Systems Engineering Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aura-ai/aura"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"
sysinfo = "0.33"
raw-cpuid = "11.1"
libc = "0.2"
dirs = "5.0"
which = "6.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Workspace crates cross-references
aura-core = { path = "crates/aura-core" }
aura-hardware = { path = "crates/aura-hardware" }
aura-model = { path = "crates/aura-model" }
aura-planner = { path = "crates/aura-planner" }
aura-memory = { path = "crates/aura-memory" }
aura-backends = { path = "crates/aura-backends" }
aura-benchmark = { path = "crates/aura-benchmark" }
aura-audit = { path = "crates/aura-audit" }
